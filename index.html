<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌸 Inkubator Telur Monitor 🥚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-light:#ffe3ef;
    --pink-mid:#ffb6d0;
    --pink-deep:#ff7fac;
    --pink-dark:#e84a8a;
    --peach:#ffe9dc;
    --cream:#fff8f5;
    --card-bg:rgba(255, 255, 255, 0.68);
    --card-border:rgba(255, 182, 208, 0.85);
    --stat-bg:rgba(255, 249, 247, 0.94);
    --text:#5a3346;
    --text-muted:rgba(90, 51, 70, 0.72);
    --shadow-color:rgba(232, 74, 138, 0.14);
    --green-ok:#52c484;
    --red-alarm:#ff5c6c;
    --amber-heat:#ff9f43;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --pink-light:#2b1924;
      --pink-mid:#633049;
      --pink-deep:#ff7fac;
      --pink-dark:#ffa3c8;
      --peach:#35202b;
      --cream:#1e1319;
      --card-bg:rgba(43, 25, 36, 0.72);
      --card-border:rgba(255, 127, 172, 0.32);
      --stat-bg:rgba(33, 20, 27, 0.94);
      --text:#ffe6f0;
      --text-muted:rgba(255, 230, 240, 0.72);
      --shadow-color:rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"]{
    --pink-light:#2b1924;
    --pink-mid:#633049;
    --pink-deep:#ff7fac;
    --pink-dark:#ffa3c8;
    --peach:#35202b;
    --cream:#1e1319;
    --card-bg:rgba(43, 25, 36, 0.72);
    --card-border:rgba(255, 127, 172, 0.32);
    --stat-bg:rgba(33, 20, 27, 0.94);
    --text:#ffe6f0;
    --text-muted:rgba(255, 230, 240, 0.72);
    --shadow-color:rgba(0, 0, 0, 0.35);
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    min-height:100%;
    font-family:'Quicksand', 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 12% 15%, rgba(255, 127, 172, 0.24), transparent 42%),
      radial-gradient(circle at 88% 80%, rgba(255, 182, 208, 0.28), transparent 45%),
      linear-gradient(155deg, var(--pink-light) 0%, var(--peach) 50%, var(--cream) 100%);
    background-attachment:fixed;
    color:var(--text);
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    transition:background 0.4s ease, color 0.3s ease;
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }

  /* ---------- Background decor: sakura petals + floating eggs ---------- */
  .bg-decor{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .petal{
    position:absolute; top:-10%;
    background:linear-gradient(135deg, #ffc2d9, var(--pink-deep));
    border-radius:0 100% 0 100%;
    box-shadow:0 2px 6px rgba(255, 127, 172, 0.25);
    animation:fallSway linear infinite;
  }
  @keyframes fallSway{
    0%{ transform:translateY(0) translateX(0) rotate(0deg) scale(1); }
    50%{ transform:translateY(55vh) translateX(35px) rotate(160deg) scale(0.92); }
    100%{ transform:translateY(112vh) translateX(-15px) rotate(320deg) scale(1); }
  }

  .egg-bg{
    position:absolute;
    opacity:.16;
    animation:eggFloat 7s ease-in-out infinite;
  }
  @keyframes eggFloat{
    0%, 100%{ transform:translateY(0) rotate(var(--rot, 0deg)); }
    50%{ transform:translateY(-12px) rotate(calc(var(--rot, 0deg) + 5deg)); }
  }

  /* Click sparkle particle */
  .click-sparkle{
    position:fixed;
    pointer-events:none;
    z-index:999;
    font-size:14px;
    animation:sparklePop 0.75s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes sparklePop{
    0%{ opacity:1; transform:translate(-50%, -50%) scale(0.5); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25); }
  }

  /* ---------- Layout & Header ---------- */
  .wrap{
    position:relative; z-index:1;
    max-width:760px;
    margin:0 auto;
    padding:22px 18px 64px;
  }

  .top-bar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:6px;
  }
  .pill-toggle{
    background:var(--card-bg);
    color:var(--pink-dark);
    border:1.5px solid var(--card-border);
    border-radius:999px;
    padding:6px 14px;
    font-family:inherit;
    font-size:.82rem;
    font-weight:700;
    cursor:pointer;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 12px var(--shadow-color);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .pill-toggle:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px var(--shadow-color);
  }
  .pill-toggle.muted{
    opacity:0.72;
  }

  header{
    text-align:center;
    margin-bottom:24px;
    animation:fadeSlideDown 0.6s ease both;
  }
  @keyframes fadeSlideDown{
    from{ opacity:0; transform:translateY(-14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .mascot-wrap{
    display:inline-block;
    cursor:pointer;
    user-select:none;
    margin-bottom:6px;
  }
  .egg-mascot{
    width:64px;
    display:block;
    margin:0 auto;
    filter:drop-shadow(0 6px 12px rgba(232, 74, 138, 0.22));
    animation:mascotWobble 3.5s ease-in-out infinite;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .mascot-wrap:hover .egg-mascot{
    transform:scale(1.1) rotate(-4deg);
  }
  .mascot-wrap.happy .egg-mascot{
    animation:mascotJump 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes mascotWobble{
    0%, 100%{ transform:rotate(-3deg) translateY(0); }
    50%{ transform:rotate(3deg) translateY(-4px); }
  }
  @keyframes mascotJump{
    0%{ transform:scale(1) translateY(0); }
    40%{ transform:scale(1.18, 0.9) translateY(-12px); }
    75%{ transform:scale(0.95, 1.06) translateY(2px); }
    100%{ transform:scale(1) translateY(0); }
  }

  header h1{
    margin:0;
    font-size:1.78rem;
    font-weight:700;
    letter-spacing:-0.3px;
    color:var(--pink-dark);
    text-shadow:0 2px 10px rgba(255, 127, 172, 0.25);
  }
  header p{
    margin:6px 0 0;
    font-size:.94rem;
    font-weight:500;
    color:var(--text-muted);
  }

  /* ---------- Cards ---------- */
  .card{
    background:
